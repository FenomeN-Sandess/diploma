scenarios:
  - name: normal_corridor
    label: normal
    description: "Нормальное движение группы по коридору к общей цели."
    agent_count: 30
    world_size: [20.0, 6.0]
    steps: 80
    dt: 0.1
    start_regions:
      - x: [1.0, 3.0]
        y: [1.0, 5.0]
        count: 30
        goal_index: 0
    goals:
      - x: 18.5
        y: 3.0
        tolerance: 0.7
    speed:
      desired_speed_mean: 1.25
      desired_speed_std: 0.12
      max_speed: 1.8
      relaxation_time: 0.6
      social_force_strength: 0.8
      social_force_range: 0.9
      wall_force_strength: 10.0
      wall_force_range: 0.2
      body_force_strength: 0.4
      friction_strength: 0.1
      radius: 0.3

